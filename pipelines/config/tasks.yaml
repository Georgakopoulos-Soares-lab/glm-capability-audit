  train_cap:   0
  imbalanced:  false
  in_paper:    true
  note: >
    Temporally disjoint and only ~2% train/test overlap -- the one benchmark that
    is homology-clean by construction.  Capped at 8,192 bp: the CNN ladder's
    F.interpolate crashes on the native ~32 kb sequences.

viral_vs_host:
  name:        viral_vs_host
  dir:         ${VB_DATA}/viral_vs_host/chunks1000
  loader:      csvdir
  esc:         viral_vs_host
  train_cap:   0
  imbalanced:  false
  in_paper:    false
  note: >
    EXCLUDED from the headline table, deliberately.  k-mer GBT reaches 0.9723 on
    the homolog-free rows and NN-lookup 1.0000 on the homolog-available rows, so
    maximum model headroom is +0.028.  The task cannot separate models; reported
    as a saturation result, not fine-tuned.
