# What we evaluate on.  One entry per discriminative task in the paper.
#
# Every field here is part of the CELL DEFINITION -- change one and you are
# measuring something else, so the value is written into output filenames.
#
# dir        : holds train.csv / dev.csv / test.csv with columns sequence,label
#              (loader "geneb" instead reads text,label and carves dev itself)
# loader     : how scripts/common/capacity_sweep.py should read it
# train_cap  : stratified cap on TRAIN rows; MUST match the fine-tuning arm's
#              --cap_train or the baseline and the model see different data
# imbalanced : report MCC + AUPRC, never accuracy; class-weight the baselines
# cluster_csv: test-row-order file with a `cluster` column = the unit of
#              statistical dependence for the bootstrap.  Absent means the
#              bootstrap falls back to ROWS and its interval is anti-conservative.
# in_paper   : false = measured and reported as a negative//out-of-scope result,
#              not part of the headline table.  Kept so the exclusion is explicit.

vhdb:
  name:        VHDB_within_family
  dir:         ${VB_DATA}/vhdb_tropism/within_family_1000bp
  loader:      csvdir
  esc:         vhdb_tropism_wf1000
  sweep_tag:   csvdir__vhdb_tropism_wf1000__cw_balanced
  train_cap:   0
  imbalanced:  true
  cluster_csv: ${VB_DATA}/vhdb_tropism/within_family_1000bp/test_full.csv
  tax_train:   ${VB_DATA}/vhdb_tropism/within_family_1000bp/train_tax.csv
  tax_test:    ${VB_DATA}/vhdb_tropism/within_family_1000bp/test_tax.csv
  author_ckpt: duttaprat/HViLM-Tropism
  focus_model: hvilm
  in_paper:    true
  note: >
    Built here, not published: Virus-Host DB host tropism, within-family negatives.
    The only task shipping genuine genome clusters, so its bootstrap is the one
    with a correct resampling unit (349 clusters / 3,754 rows).

