# conda env create -f environment.yml && conda activate glm-audit
#
# Includes mmseqs2, which the homology audits require and pip cannot provide.
name: glm-audit
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - pip
  - numpy>=1.24
  - pandas>=2.0
  - scikit-learn>=1.3
  - scipy>=1.10
  - pyarrow>=14.0
  - pytest>=7.4
  - mmseqs2>=14
  - pip:
      # Install the CUDA build matching your driver; CPU wheels are fine for the
      # k-mer, CNN-ladder and homology work, and only the gLM runs need a GPU.
      - torch>=2.1
      # DNABERT-2 is blocked on transformers>=4.48 by a config_class conflict.
      - "transformers>=4.40,<4.48"
      - peft>=0.10
      - huggingface_hub>=0.20
