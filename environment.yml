# The environment for everything in this repository.
#
#   conda env create -f environment.yml
#   conda activate glm-audit
#
# One environment runs the whole pipeline and the whole analysis layer. It
# includes mmseqs2, which every homology search needs and pip cannot provide.
name: glm-audit
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - pip
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn>=1.3
  - xgboost>=2.0          # the gradient-boosted k-mer and amino-acid arms
  - pyyaml>=6.0           # pipelines/config/*.yaml
  - pyarrow>=14.0         # HVUE ships as parquet
  - pytest>=7.4
  - mmseqs2>=14
  - pip:
      # Install the CUDA build matching your driver. CPU wheels are enough for
      # the k-mer arms, the homology searches and all of analysis/; only
      # fine-tuning and the capacity ladders need a GPU.
      - torch>=2.1
      # <4.48 is required: DNABERT-2 hits a config_class conflict above it.
      - "transformers>=4.40,<4.48"
      - peft>=0.10
      - huggingface_hub>=0.20
